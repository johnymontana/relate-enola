name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DO_NOT_TRACK: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: "Test (offline: no Enola, no Relate)"
        run: cargo test --all-targets

  msrv:
    name: msrv (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.87"
      - run: cargo test --all-targets

  integration:
    name: integration (relate ${{ matrix.relate }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        relate: [v1.1.0, latest]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Install relate ${{ matrix.relate }}
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=relate-linux-amd64 ;;
            Linux-ARM64) asset=relate-linux-arm64 ;;
            macOS-ARM64) asset=relate-darwin-arm64 ;;
            macOS-X64) asset=relate-darwin-amd64 ;;
          esac
          tag=${{ matrix.relate }}
          [ "$tag" = latest ] && tag=$(gh release view -R relatedb/relate --json tagName --jq .tagName)
          mkdir -p "$RUNNER_TEMP/relate" && cd "$RUNNER_TEMP/relate"
          gh release download "$tag" -R relatedb/relate -p "$asset" -p SHA256SUMS
          grep " $asset\$" SHA256SUMS | shasum -a 256 -c -
          chmod +x "$asset" && mv "$asset" relate
          ./relate --version
          echo "RELATE_BIN=$PWD/relate" >> "$GITHUB_ENV"
      - name: Integration tests against a real relate
        run: cargo test --test integration
      - name: Fetch the pinned Enola for this runner
        shell: bash
        run: scripts/fetch-enola.sh | tail -1 >> "$GITHUB_ENV"
      - name: Integration tests with bundled Enola (live generation)
        run: cargo test --features bundled-enola --test integration

  goldens:
    name: golden drift (Enola pinned in enola.lock.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Regenerate fixtures and compare
        run: scripts/regen-goldens.sh --check
